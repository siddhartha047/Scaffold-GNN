status: source_settings_imported_not_rerun
selection_rule: Preserve the recorded configurations; checkpoints use validation. The source table also compares
  test means between older and newer K campaigns.
source_table: 1andKshot_main_results.pdf
source_settings_sha256: aa2c1950fd5d8eb6501742db1cb55a2b03e45dac06794e9b6d9a0c903f9a07f3
evaluation_protocols:
  scaffold_1: One frozen support; sparse validation and test.
  scaffold_k: Refreshed supports; validation-ranked union of the recorded K (5 or 10).
  scaffold_full: Sparse training; original full-graph evaluation. This block is absent from the main PDF and
    comes from the separate full-evaluation campaign.
notes:
- The default command is asynchronous Sample with full-graph evaluation. Recipes preserve historical refresh
  and evaluation protocols, including synchronous runs.
- Cora exposes only Greedy-1 and Heap-1 reference recipes; these are configured examples, not measurements
  in the supplied PDF.
- Fast-K on Roman-empire and Squirrel cannot be linked to a matching Fast run; the printed values match Sample
  logs. The supplied Fast recipes are marked as not matching those paper cells.
- Sample artifacts are built locally when missing; source worker counts are provenance, while --workers respects
  the current allocation.
