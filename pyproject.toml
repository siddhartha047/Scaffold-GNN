[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffold-gnn-research"
version = "0.1.0"
description = "Support-graph sparsification and shared GNN comparison experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy", "scipy", "torch>=2.2", "torch-geometric>=2.5", "torch-sparse>=0.6.18", "torch-scatter>=2.1", "ogb>=1.3.6",
  "networkx>=3", "networkit>=11", "numba", "scikit-learn", "PyYAML",
  "pandas", "tqdm", "gdown", "matplotlib", "psutil"
]

[project.optional-dependencies]
test = ["pytest>=8", "build"]
figures = ["PyMuPDF"]
proteins = ["dgl"]

[project.scripts]
scaffold-gnn = "scaffold_gnn.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scaffold_gnn*", "configs*", "scripts*", "RelatedMethods*"]
exclude = ["*.__pycache__*", "*.results*", "*.build*", "*.data.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.sh", "*.toml", "*.jl", "*.cc", "*.cpp", "*.h", "*.txt", "LICENSE*", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
